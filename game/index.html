<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar City — an open-world crime story</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1622; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  #hud-top { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
  #wanted { font-size: 30px; letter-spacing: 4px; color: #ffd76a; text-shadow: 0 2px 6px #000; }
  #money { font-size: 30px; font-weight: 800; color: #7dff9a; text-shadow: 0 2px 6px #000; }
  #health-wrap { position: absolute; top: 58px; left: 16px; width: 220px; height: 18px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4); }
  #health-bar { height: 100%; width: 100%; background: #37d67a; }
  #health-num { position: absolute; right: 6px; top: 0; font-size: 13px; font-weight: 700; line-height: 18px; text-shadow: 0 1px 3px #000; }
  #ammo { position: absolute; top: 84px; left: 16px; font-size: 18px; font-weight: 700; text-shadow: 0 2px 4px #000; }
  #speed { position: absolute; right: 16px; bottom: 18px; font-size: 34px; font-weight: 800; text-align: right; text-shadow: 0 2px 6px #000; }
  #speed span { font-size: 15px; font-weight: 600; }
  #car-name { font-size: 15px; font-weight: 600; color: #ffd76a; }
  #objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 46vw; background: rgba(10,18,28,.72); border: 1px solid rgba(255,215,106,.6); padding: 8px 16px; font-size: 16px; font-weight: 600; text-align: center; }
  #dialogue { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); max-width: 640px; background: rgba(10,18,28,.85); border-left: 4px solid #ff9f1c; padding: 12px 18px; font-size: 17px; font-style: italic; display: none; }
  #banner { position: absolute; left: 50%; top: 34%; transform: translate(-50%,-50%); font-size: 44px; font-weight: 900; color: #ffd76a; text-shadow: 0 3px 12px #000, 0 0 30px rgba(255,180,0,.5); display: none; text-align: center; white-space: nowrap; }
  #minimap { position: fixed; right: 16px; top: 110px; width: 230px; height: 176px; border: 2px solid rgba(255,255,255,.55); z-index: 6; background: #1d2b1f; }
  #title-screen, #pause-screen, #over-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,12,20,.72); pointer-events: none; }
  #title-screen h1 { font-size: 84px; margin: 0; letter-spacing: 8px; color: #ffd76a; text-shadow: 0 4px 24px rgba(255,180,0,.6); }
  #title-screen p { font-size: 20px; margin: 10px 0; }
  #title-screen .keys { font-size: 16px; color: #cfe6ff; line-height: 1.8; text-align: center; }
  .press { font-size: 22px !important; font-weight: 800; color: #7dff9a; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  #pause-screen h2, #over-screen h2 { font-size: 64px; margin: 0; color: #ff5040; letter-spacing: 6px; }
  #over-screen p, #pause-screen p { font-size: 20px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
